name: Python package

on:
  pull_request:
    paths: ["python/**", "tests/**", "schema/**", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["python/**", "tests/**", "schema/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  check:
    name: knownas-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
