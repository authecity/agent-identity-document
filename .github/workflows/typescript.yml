name: TypeScript package

on:
  pull_request:
    paths: ["typescript/**", "tests/**", "schema/**", ".github/workflows/typescript.yml"]
  push:
    branches: [main]
    paths: ["typescript/**", "tests/**", "schema/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

jobs:
  check:
    name: "@knownas/verify"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
